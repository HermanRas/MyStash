# Builds the single MyStash container, proves it actually serves the app, and
# publishes it to GHCR.
#
# The order matters: nothing is pushed that has not first been started and
# talked to. A Dockerfile that builds is not the same claim as an image that
# answers on 8080 with php-fpm alive behind it, and the whole point of folding
# nginx and php-fpm into one container is that "it built" stops being enough.
#
# What this does not run: the dev/*.sh browser checks. They drive a Playwright
# container whose node_modules live in dev/playwright/.pwlib, which is
# gitignored and not reconstructible from anything in the repository. The smoke
# suite below needs nothing but the image itself.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Work out the image name
        # Docker repository names must be lowercase and GitHub account names
        # need not be — `HermanRas` is rejected outright by the builder. This
        # is done here rather than hardcoded so a fork publishes under its own
        # owner without editing the workflow.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mystash" >> "$GITHUB_ENV"

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ./App
          # Loaded into the local daemon rather than pushed: the push is a
          # separate step at the end, after the checks below have passed.
          load: true
          tags: mystash-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: |
          # App/Data is gitignored, so a fresh checkout has no datastore. The
          # container writes as www-data (uid 33) while the checkout belongs to
          # the runner, which is the one place those two have to agree.
          mkdir -p App/Data && chmod 777 App/Data
          docker compose up -d --no-build

          # Wait on `/`, not on a static file. A static file proves nginx is
          # listening and nothing more — php-fpm can still be starting behind
          # it, and every PHP request in that window is a 502. Waiting on the
          # redirect waits on both processes, which is the thing being tested.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = 302 ] && echo "ready after ${i}s" && exit 0
            # A container that has exited is never going to become ready, and
            # the reason is in its log rather than in another 59 seconds.
            [ "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -aq app)")" = false ] && break
            sleep 1
          done

          echo "::error::the stack never served a PHP request (last status ${code:-none})"
          docker compose ps -a
          docker compose logs app
          exit 1

      - name: It serves the app
        run: |
          fail() { echo "::error::$1"; docker compose logs app; exit 1; }

          # nginx is up...
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login.html)
          [ "$code" = 200 ] || fail "login.html answered $code"

          # ...and php-fpm is alive behind it. A 502 here is the half-container
          # failure the entrypoint exists to prevent, and it is invisible to a
          # check that only asks nginx for a static file.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          [ "$code" = 302 ] || fail "/ answered $code, expected a redirect to the login page"

          # The font is served from this host, not Google's. Docs/SPECIFICATIONS.md §1.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   http://localhost:8080/assets/fonts/carter-one-latin-400.woff2)
          [ "$code" = 200 ] || fail "the self-hosted font answered $code"

          # Both processes are in there.
          docker compose exec -T app sh -c 'pgrep -x nginx >/dev/null && pgrep -x php-fpm >/dev/null' \
            || fail "nginx and php-fpm are not both running"

      - name: Smoke suite
        run: docker compose exec -T -u www-data app php /app/tests/smoke_test.php

      - name: The container dies with php-fpm
        run: |
          # The guarantee restart: unless-stopped depends on. If php-fpm can die
          # while the container stays up, every page is a 502 and nothing
          # notices.
          docker compose exec -T app sh -c 'kill -9 $(pgrep -o php-fpm)' || true
          for i in $(seq 1 15); do
            state=$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -aq app)")
            [ "$state" = false ] && echo "the container stopped, as it should" && exit 0
            sleep 1
          done
          echo "::error::php-fpm died and the container stayed up"
          docker compose logs app
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./App
          push: true
          # Two tags on purpose: `latest` is what a host pulls, `sha-…` is what
          # you name when something is wrong with `latest` and you need to say
          # which build you mean.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Every layer is already in the cache from the build above, so this
          # step assembles and uploads rather than rebuilding.
          cache-from: type=gha
