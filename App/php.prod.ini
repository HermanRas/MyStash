; Production hardening, mounted over the development settings by
; docker-compose.prod.yml. Everything here is deliberately NOT in php.ini:
; these are the settings that make the app harder to debug, which is the right
; trade in production and the wrong one on a laptop.

; A PHP fatal renders its stack trace, and a stack trace includes the
; arguments each frame was called with — which in this app means the
; user's password, truncated to 15 characters, on the page. Errors go to the
; container log instead, where `docker compose logs php` finds them.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; And the log itself must not hold what the page no longer shows: PHP's
; stack traces carry each frame's arguments, and ingest() and Crypto7z are
; called with the password. Without this, one failed upload writes the first
; 15 characters of a user's encryption key into `docker compose logs`, where
; it stays. Traces lose their arguments entirely — worth it here, because the
; argument that matters most is the one that must never be recorded.
zend.exception_ignore_args = 1

; Drops the X-Powered-By header. Not a defence on its own; there is no reason
; to publish the exact PHP version either.
expose_php = Off

; The session cookie is the key to a decrypted stash for as long as the login
; lasts, so it is worth the three lines: script cannot read it, it does not
; ride along on cross-site requests, and a session id the server never issued
; is refused rather than adopted.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Uncomment ONLY behind TLS. With this on, a browser will not send the cookie
; over plain HTTP at all — the login will appear to succeed and then bounce
; straight back to the login screen.
;session.cookie_secure = 1
