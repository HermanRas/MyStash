<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyStash — Profile</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="wall.php">
    <img src="assets/img/icon.png" alt="MyStash">
    MyStash
  </a>
  <div class="search-bar">
    <input type="text" placeholder="Search videos, creators, categories…">
  </div>
  <div class="header-actions">
    <div class="user-menu" tabindex="0">
      <div class="user-menu-trigger">
        <div class="avatar"></div>
        TestUser
      </div>
      <div class="user-menu-dropdown">
        <a href="creator.html">Manage Creators</a>
        <a href="user.html">Profile &amp; Password</a>
        <a href="logout.php">Log Out</a>
      </div>
    </div>
  </div>
</header>

<h1 class="page-title">Profile</h1>

<main class="container" style="max-width:480px;">
  <div class="card">
    <div class="field">
      <label>Username</label>
      <input type="text" value="TestUser" disabled>
    </div>
  </div>

  <div class="section-title">Change Password</div>
  <div class="card">
    <form action="#" method="post">
      <div class="field">
        <label for="current-password">Current password</label>
        <input type="password" id="current-password" name="current_password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" name="new_password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn">Re-encrypt Stash with New Password</button>
    </form>
    <p class="hint">
      This re-encrypts every video in your stash with the new password. The current
      encrypted copy of each file is kept as <code>.mp4.enc.old</code> until the whole
      process succeeds, then removed.
    </p>
  </div>
</main>

</body>
</html>
