<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyStash — Login</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="form-page">
  <div class="form-card">
    <div class="brand">
      <img src="assets/img/icon.png" alt="MyStash">
      MyStash
    </div>

    <p class="hint" id="login-error" hidden style="color:#ff6b6b;">Incorrect username or password.</p>

    <form action="login.php" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Unlock Stash</button>
    </form>

    <p class="hint">Your password is never stored — it's the key that decrypts your stash. Wrong password or unknown username look identical: access denied.</p>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).has('error')) {
    document.getElementById('login-error').hidden = false;
  }
</script>
</body>
</html>
