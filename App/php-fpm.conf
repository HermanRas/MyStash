[www]
; media.php streams a decrypted video through PHP, and a range request holds
; its worker for as long as the player is pulling bytes. A handful of tiles
; loading previews while one video plays is therefore several workers at once,
; which is the whole reason for moving off the single-threaded built-in server
; (Docs/PLAN.md 4.28).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Jobs are detached (bin/job_worker.php), so no request should ever run long
; enough to need this. It is here as a backstop with a value well above a large
; upload and well below "wedged forever".
request_terminate_timeout = 600

; Worker output goes to the container log rather than being swallowed, which is
; how error_log() from a failed convert or re-key reaches `docker compose logs`.
catch_workers_output = yes
decorate_workers_output = no
