server {
    listen 8080;
    server_name _;

    root /app/public;
    index index.php;

    # Uploads are whole video files. php.ini's upload_max_filesize/post_max_size
    # are the real gate; this just stops nginx refusing the body before PHP ever
    # sees it (the default is 1M, which would reject every video).
    client_max_body_size 2G;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php;
    }

    # Browsers ask for this by fixed path whatever the pages declare, and
    # without it the request falls through to index.php and answers the
    # favicon with a redirect to the login page.
    location = /favicon.ico {
        alias /app/public/assets/img/icon.png;
        # The file really is a PNG. An empty `types` block clears the MIME map
        # for this location so the .ico in the URL does not decide the type.
        types { }
        default_type image/png;
        access_log off;
    }

    location ~ \.php$ {
        # Refuse anything that is not a real file before handing it to PHP.
        # Without this, /media.php/x.jpg would still reach PHP and be executed
        # under a path it did not expect.
        try_files $uri =404;

        include fastcgi_params;
        # php-fpm is in this container, on the loopback interface. It is not
        # published and not on the compose network: nothing outside this
        # container can reach 9000 at all.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;

        # No request runs a transcode or a re-key any more — those are detached
        # jobs — but uploading a 2GB file over a slow link legitimately takes a
        # while, and this must not be the thing that kills it.
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;

        # media.php decrypts and streams video, including range requests. With
        # buffering on, nginx stages the whole response before sending the first
        # byte, so seeking in a long video would stall until the entire file had
        # been decrypted.
        fastcgi_buffering off;
    }

    # Nothing outside public/ is reachable, but say so rather than relying on
    # the root never being widened by accident.
    location ~ /\. { deny all; }
}
