services:
  # One container: nginx on 8080 with php-fpm behind it on the container's own
  # loopback. They were two services until now; see App/Dockerfile for why they
  # are not any more. The service is still called "app" and still listens on
  # 8080, so every bookmark, every dev/playwright check (BASE_URL=http://app:8080)
  # and every dev/*.sh keep working.
  app:
    build: ./App
    # Named explicitly rather than left to Compose's project-service default,
    # so CI can build the image once and then bring this up with --no-build
    # and know it is testing exactly the image it is about to publish.
    image: mystash-app:latest
    ports:
      - "8080:8080"
    volumes:
      - ./App:/app
    # Development only. The image hardens PHP by default — display_errors off,
    # errors to the log — so that a deployment which forgets to say anything
    # gets the safe settings. Here we do want the stack trace on the page.
    environment:
      MYSTASH_DEV: "1"
    # Every decrypt stages plaintext in /dev/shm — the extract dirs, the convert
    # work dirs, the sessions and the job records. Docker's default is 64M,
    # which is smaller than a single video: extraction would simply fail.
    #
    # 4gb, not the 2gb this was: ingest stages the whole original there while
    # it encrypts, and a convert stages the original *and* the output. With
    # upload_max_filesize at 2G (App/php.ini), 2gb could not hold a maximum
    # upload at all — which is precisely how prod died on a 101MB video with a
    # 64M /dev/shm, and would have died again at 2gb on a large one. tmpfs
    # allocates lazily, so the higher ceiling costs nothing until it is used.
    shm_size: 4gb
